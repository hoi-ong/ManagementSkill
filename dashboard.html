<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng điểm lớp</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#64748b;font-size:13px;margin-bottom:18px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:16px}
button{font:inherit;padding:9px 16px;border-radius:9px;border:0;background:#1e2761;color:#fff;cursor:pointer}
button.ghost{background:#e2e8f0;color:#1e2761}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid #e2e8f0;text-align:left}
th{background:#f8fafc;cursor:pointer;user-select:none;white-space:nowrap;font-size:13px}
th:hover{background:#eef2f7}
tbody tr:hover{background:#f8fafc}
.pass{color:#166534;font-weight:600}
.fail{color:#b91c1c;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px;color:#1e2761}
.stat span{font-size:12px;color:#64748b}
.msg{padding:10px 12px;border-radius:9px;font-size:13px;margin-top:10px}
.err{background:#fee2e2;color:#b91c1c}
.ok{background:#dcfce7;color:#166534}
.gate{max-width:420px;margin:12vh auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:26px;text-align:center}
.gate h2{margin:0 0 6px;font-size:19px}
.gate p{color:#64748b;font-size:13px;margin:0 0 16px}
.gate input{width:100%;text-align:center;letter-spacing:3px;margin-bottom:10px}
.tbl-wrap{overflow-x:auto}
@media(max-width:640px){th,td{padding:7px 6px;font-size:13px}}
</style>
</head>
<body>

<!-- ===== CỔNG PASSCODE ===== -->
<div id="gate" class="gate">
  <h2>🔒 Bảng điểm giáo viên</h2>
  <p>Nhập mã truy cập để xem kết quả học viên.</p>
  <input id="pin" type="password" placeholder="Mã truy cập" autocomplete="off">
  <button id="btnPin" style="width:100%">Vào xem</button>
  <div id="pinMsg"></div>
</div>

<!-- ===== NỘI DUNG ===== -->
<div class="wrap" id="app" style="display:none">
  <div class="row" style="justify-content:space-between;margin-bottom:6px">
    <h1>Bảng điểm lớp</h1>
    <div class="row">
      <button class="ghost" onclick="location.href='index.html'">← Link bài test</button>
      <button class="ghost" id="btnOut">Thoát</button>
    </div>
  </div>
  <div class="sub" id="src"></div>

  <div class="card">
    <div class="row">
      <button id="btnLoad">Tải bảng điểm</button>
      <button class="ghost" id="btnCsv">Xuất CSV</button>
      <input id="q" placeholder="Tìm tên / email…" style="flex:1;min-width:160px">
      <select id="cls"><option value="">Tất cả lớp</option></select>
      <select id="test">
        <option value="">Mọi bài</option>
        <option value="30">Bài 30 câu</option>
        <option value="50">Bài 50 câu</option>
      </select>
      <select id="view">
        <option value="best">Điểm cao nhất</option>
        <option value="last">Lần gần nhất</option>
        <option value="all">Tất cả lượt</option>
      </select>
    </div>
    <div id="msg"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card tbl-wrap">
    <table id="tbl">
      <thead><tr>
        <th data-c="0">Thời gian</th>
        <th data-c="1">Họ tên</th>
        <th data-c="2">Lớp ▲</th>
        <th data-c="3">Email</th>
        <th data-c="4">Điểm</th>
        <th data-c="5">Tổng câu</th>
        <th data-c="6">%</th>
        <th data-c="7">Kết quả</th>
        <th data-c="8">Lượt</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px;font-size:16px">Tổng hợp theo lớp</h3>
    <div class="tbl-wrap"><table id="byclass">
      <thead><tr><th>Lớp</th><th>Số HV</th><th>Điểm TB (%)</th><th>Đạt</th><th>Chưa đạt</th><th>Tỉ lệ đạt</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
/* ====== MÃ TRUY CẬP — đổi tại đây ====== */
var PASSCODE = "spkhh";
/* ======================================= */

var $ = function(id){ return document.getElementById(id); };

function openApp(){
  $("gate").style.display = "none";
  $("app").style.display = "block";
  $("src").textContent = CONFIG.owner + "/" + CONFIG.repo + " • " + CONFIG.path;
  load();
}
function tryPin(){
  if ($("pin").value.trim().toLowerCase() === PASSCODE){
    sessionStorage.setItem("dashOk","1");
    openApp();
  } else {
    $("pinMsg").className = "msg err";
    $("pinMsg").textContent = "Mã truy cập không đúng.";
    $("pin").value = "";
  }
}
$("btnPin").onclick = tryPin;
$("pin").addEventListener("keydown", function(e){ if(e.key === "Enter") tryPin(); });
$("btnOut").onclick = function(){ sessionStorage.removeItem("dashOk"); location.reload(); };
if (sessionStorage.getItem("dashOk") === "1") openApp(); else $("pin").focus();

/* ---------- Dữ liệu ---------- */
var ROWS = [], sortCol = 2, sortDir = 1;

function say(t, cls){ $("msg").className = "msg " + cls; $("msg").textContent = t; }

function load(){
  say("Đang tải dữ liệu…", "ok");
  var url = "https://raw.githubusercontent.com/" + CONFIG.owner + "/" + CONFIG.repo
          + "/" + CONFIG.branch + "/" + CONFIG.path + "?t=" + Date.now();
  fetch(url).then(function(r){
    if (!r.ok) throw new Error(r.status);
    return r.arrayBuffer();
  }).then(function(buf){
    parse(buf);
    say("Đã tải " + ROWS.length + " lượt làm bài.", "ok");
  }).catch(function(e){
    say("Chưa đọc được file kết quả (" + e.message + "). Kiểm tra: repo đã Public chưa, tên nhánh trong config.js có đúng không, và đã có học viên nào nộp bài chưa.", "err");
  });
}

function parse(buf){
  var wb = XLSX.read(new Uint8Array(buf), {type:"array"});
  var ws = wb.Sheets[wb.SheetNames[0]];
  var aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
  ROWS = [];
  for (var i = 1; i < aoa.length; i++){
    var r = aoa[i];
    if (!r || !r[1]) continue;
    ROWS.push({
      time: String(r[0]||""), name: String(r[1]||""), cls: String(r[2]||""),
      email: String(r[3]||""), score: Number(r[4])||0, total: Number(r[5])||0,
      pct: Number(r[6])||0, attempt: Number(r[8])||1
    });
  }
  fillClasses();
  render();
}

function fillClasses(){
  var set = {}, i;
  for (i = 0; i < ROWS.length; i++) if (ROWS[i].cls) set[ROWS[i].cls] = 1;
  var list = Object.keys(set).sort(function(a,b){ return a.localeCompare(b,"vi"); });
  var sel = $("cls"), cur = sel.value;
  sel.innerHTML = '<option value="">Tất cả lớp</option>';
  for (i = 0; i < list.length; i++){
    var o = document.createElement("option");
    o.value = list[i]; o.textContent = list[i]; sel.appendChild(o);
  }
  sel.value = cur;
}

function passOf(r){ return Math.ceil(r.total * 0.6); }
function keyOf(r){ return (r.email ? r.email.toLowerCase() : (r.name + "|" + r.cls).toLowerCase()); }

function filtered(){
  var q = $("q").value.trim().toLowerCase();
  var c = $("cls").value, t = $("test").value, v = $("view").value;
  var out = ROWS.filter(function(r){
    if (c && r.cls !== c) return false;
    if (t && String(r.total) !== t) return false;
    if (q && (r.name + " " + r.email).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  if (v !== "all"){
    var m = {};
    out.forEach(function(r){
      var k = keyOf(r) + "|" + r.total, p = m[k];
      if (!p) { m[k] = r; return; }
      if (v === "best"){ if (r.score > p.score) m[k] = r; }
      else { if (r.attempt >= p.attempt) m[k] = r; }
    });
    out = Object.keys(m).map(function(k){ return m[k]; });
  }
  var f = ["time","name","cls","email","score","total","pct","score","attempt"][sortCol];
  out.sort(function(a,b){
    var x = a[f], y = b[f];
    if (typeof x === "number") return (x - y) * sortDir;
    return String(x).localeCompare(String(y), "vi") * sortDir;
  });
  return out;
}

function render(){
  var rows = filtered(), i;
  var tb = $("tbl").querySelector("tbody");
  tb.innerHTML = "";
  for (i = 0; i < rows.length; i++){
    var r = rows[i], ok = r.score >= passOf(r);
    var tr = document.createElement("tr");
    tr.innerHTML = "<td>" + r.time + "</td><td>" + r.name + "</td><td>" + r.cls
      + "</td><td>" + r.email + "</td><td><b>" + r.score + "</b></td><td>" + r.total
      + "</td><td>" + r.pct + "%</td>"
      + '<td class="' + (ok ? "pass" : "fail") + '">' + (ok ? "Đạt" : "Chưa đạt")
      + "</td><td>" + r.attempt + "</td>";
    tb.appendChild(tr);
  }
  var n = rows.length, np = 0, sum = 0;
  for (i = 0; i < n; i++){ if (rows[i].score >= passOf(rows[i])) np++; sum += rows[i].pct; }
  $("stats").innerHTML =
      '<div class="stat"><b>' + n + '</b><span>Bài làm</span></div>'
    + '<div class="stat"><b>' + np + '</b><span>Đạt</span></div>'
    + '<div class="stat"><b>' + (n - np) + '</b><span>Chưa đạt</span></div>'
    + '<div class="stat"><b>' + (n ? Math.round(sum/n) : 0) + '%</b><span>Điểm TB</span></div>';

  var g = {};
  rows.forEach(function(r){
    var k = r.cls || "(không ghi)";
    if (!g[k]) g[k] = {n:0, p:0, s:0};
    g[k].n++; g[k].s += r.pct;
    if (r.score >= passOf(r)) g[k].p++;
  });
  var keys = Object.keys(g).sort(function(a,b){ return a.localeCompare(b,"vi"); });
  var bt = $("byclass").querySelector("tbody");
  bt.innerHTML = "";
  keys.forEach(function(k){
    var d = g[k], tr = document.createElement("tr");
    tr.innerHTML = "<td><b>" + k + "</b></td><td>" + d.n + "</td><td>"
      + Math.round(d.s/d.n) + "%</td><td>" + d.p + "</td><td>" + (d.n - d.p)
      + "</td><td>" + Math.round(d.p/d.n*100) + "%</td>";
    bt.appendChild(tr);
  });
}

var ths = $("tbl").querySelectorAll("th");
for (var k = 0; k < ths.length; k++){
  ths[k].onclick = function(){
    var c = Number(this.dataset.c);
    sortDir = (c === sortCol) ? -sortDir : 1;
    sortCol = c;
    for (var j = 0; j < ths.length; j++) ths[j].textContent = ths[j].textContent.replace(/ [▲▼]$/, "");
    this.textContent += sortDir > 0 ? " ▲" : " ▼";
    render();
  };
}
$("btnLoad").onclick = load;
$("q").oninput = render;
$("cls").onchange = render;
$("test").onchange = render;
$("view").onchange = render;

$("btnCsv").onclick = function(){
  var rows = filtered();
  var out = "\ufeffThời gian,Họ tên,Lớp,Email,Điểm,Tổng câu,%,Kết quả,Lượt\n";
  rows.forEach(function(r){
    var ok = r.score >= passOf(r) ? "Đạt" : "Chưa đạt";
    out += [r.time, r.name, r.cls, r.email, r.score, r.total, r.pct, ok, r.attempt]
      .map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(",") + "\n";
  });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], {type:"text/csv;charset=utf-8"}));
  a.download = "bang-diem.csv";
  a.click();
};
</script>
</body>
</html>
