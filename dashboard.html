<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng điểm lớp — Trắc nghiệm Kỹ năng Quản lý</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--card:#fff;--ink:#0f172a;--muted:#64748b;--brand:#1d4ed8;--ok:#16a34a;--bad:#dc2626;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(160deg,#0f172a,#1e3a8a 60%,#312e81);color:var(--ink);min-height:100vh;padding:16px;line-height:1.5}
.wrap{max-width:1150px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:16px}
h1{font-size:clamp(19px,4vw,27px);margin:0 0 4px}
h2{font-size:clamp(16px,3vw,20px);margin:0 0 12px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#f8fafc}
.btn{border:0;border-radius:9px;padding:11px 18px;font-size:15px;font-weight:700;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:#e2e8f0;color:#0f172a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1 1 180px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:6px}
.stat{background:#f1f5f9;border-radius:12px;padding:14px}
.stat b{display:block;font-size:clamp(20px,4vw,28px);color:var(--brand);line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0;background:#fff}
th:hover{color:var(--brand)}
tbody tr:hover{background:#f8fafc}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill.pass{background:#dcfce7;color:#166534}
.pill.fail{background:#fee2e2;color:#991b1b}
.status{font-size:14px;padding:11px 13px;border-radius:10px;margin-top:12px}
.status.warn{background:#fef3c7;color:#92400e}
.status.err{background:#fee2e2;color:#991b1b}
.status.ok{background:#dcfce7;color:#166534}
.hidden{display:none}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}
@media(max-width:560px){.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>Bảng điểm lớp</h1>
    <p class="sub" id="src"></p>
    <div class="row">
      <div><button class="btn" id="loadBtn" type="button">Tải bảng điểm</button></div>
      <div><button class="btn sec" id="csvBtn" type="button">Xuất CSV</button></div>
      <div><button class="btn sec" id="xlsxBtn" type="button">Tải file Excel gốc</button></div>
      <div><a class="btn sec" href="index.html">← Link bài test</a></div>
    </div>
    <div id="tokenBox" class="hidden">
      <label for="token">Repo ở chế độ riêng tư — dán token GitHub (chỉ lưu tạm trong trình duyệt)</label>
      <input id="token" type="password" placeholder="github_pat_...">
    </div>
    <div id="msg" class="status warn">Bấm “Tải bảng điểm” để xem kết quả mới nhất.</div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <div class="stats" id="stats"></div>
      <div class="row">
        <div><label for="q">Tìm theo tên / email</label><input id="q" type="text" placeholder="Nhập tên…"></div>
        <div><label for="cls">Lớp</label><select id="cls"><option value="">Tất cả lớp</option></select></div>
        <div><label for="test">Bài test</label>
          <select id="test">
            <option value="">Tất cả</option>
            <option value="30">Bản 30 câu</option>
            <option value="50">Bản 50 câu</option>
          </select>
        </div>
        <div><label for="view">Hiển thị</label>
          <select id="view">
            <option value="best">Điểm cao nhất mỗi học viên</option>
            <option value="last">Lần làm gần nhất</option>
            <option value="all">Tất cả lượt làm</option>
          </select>
        </div>
      </div>
      <p class="hint">Đang sắp xếp theo <b>Lớp</b>. Bấm tiêu đề cột bất kỳ để đổi cách sắp xếp, bấm lần nữa để đảo chiều. Hàng nền đỏ là chưa đạt.</p>
    </div>

    <div class="card tablebox">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <p class="hint" id="count"></p>
    </div>

    <div class="card">
      <h2>Tổng hợp theo lớp</h2>
      <div class="tablebox">
        <table style="min-width:560px">
          <thead><tr><th>Lớp</th><th>Số học viên</th><th>Điểm TB (%)</th><th>Đạt</th><th>Tỷ lệ đạt</th></tr></thead>
          <tbody id="byclass"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";
  const $ = function(id){ return document.getElementById(id); };
  const COLS = ["Thời gian nộp","Họ tên","Lớp","Email","Lần làm","Điểm","Tổng câu","Tỷ lệ %","Kết quả","Số phút làm bài"];
  const FIELDS = ["time","name","clazz","email","attempt","score","total","pct","res","mins"];
  let rows = [], sortCol = 2, sortDir = 1;   // mặc định: sắp xếp theo Lớp

  $("src").textContent = "Nguồn: " + CONFIG.owner + "/" + CONFIG.repo + " • " + CONFIG.path;

  function msg(kind, text){ const e = $("msg"); e.className = "status " + kind; e.textContent = text; }

  const rawUrl = function(){
    return "https://raw.githubusercontent.com/" + CONFIG.owner + "/" + CONFIG.repo + "/"
         + CONFIG.branch + "/" + CONFIG.path + "?t=" + Date.now();
  };
  const apiUrl = function(){
    return "https://api.github.com/repos/" + CONFIG.owner + "/" + CONFIG.repo + "/contents/"
         + CONFIG.path + "?ref=" + encodeURIComponent(CONFIG.branch) + "&t=" + Date.now();
  };

  $("loadBtn").addEventListener("click", load);
  $("token").addEventListener("keydown", function(e){ if (e.key === "Enter") load(); });

  async function load(){
    msg("warn", "Đang tải dữ liệu…");
    try {
      let bytes = null;
      const r = await fetch(rawUrl(), {cache:"no-store"});
      if (r.ok) {
        bytes = new Uint8Array(await r.arrayBuffer());
      } else {
        const tok = ($("token").value || CONFIG.token || "").trim();
        if (!tok){
          $("tokenBox").classList.remove("hidden");
          msg("warn", "Không đọc được file công khai. Nếu repo ở chế độ riêng tư, hãy dán token rồi bấm lại.");
          return;
        }
        const r2 = await fetch(apiUrl(), {headers:{Authorization:"Bearer " + tok, Accept:"application/vnd.github+json"}});
        if (r2.status === 404) { msg("warn", "Chưa có bài nộp nào — file điểm sẽ được tạo sau lần nộp đầu tiên."); return; }
        if (!r2.ok) throw new Error("HTTP " + r2.status);
        const j = await r2.json();
        const bin = atob(j.content.replace(/\n/g, ""));
        bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      }
      const wb = XLSX.read(bytes, {type:"array"});
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false});
      rows = aoa.slice(1).filter(function(r){ return r && r[1]; }).map(function(r){
        return {time:r[0]||"", name:r[1]||"", clazz:r[2]||"", email:r[3]||"",
                attempt:+r[4]||1, score:+r[5]||0, total:+r[6]||50,
                pct:+r[7]||0, res:r[8]||"", mins:+r[9]||0};
      });
      if (!rows.length){ msg("warn", "File điểm chưa có dữ liệu."); return; }
      msg("ok", "Đã tải " + rows.length + " lượt làm bài.");
      $("panel").classList.remove("hidden");
      fillClasses(); render();
    } catch(e){
      msg("err", "Lỗi tải dữ liệu: " + (e.message || e));
    }
  }

  function fillClasses(){
    const set = {}; rows.forEach(function(r){ if (r.clazz) set[r.clazz] = 1; });
    $("cls").innerHTML = '<option value="">Tất cả lớp</option>'
      + Object.keys(set).sort(function(a,b){ return a.localeCompare(b,"vi"); })
          .map(function(c){ return '<option>'+esc(c)+'</option>'; }).join("");
  }

  function keyOf(r){ return (r.email || r.name + "|" + r.clazz).toLowerCase(); }
  function passOf(r){ return Math.ceil(r.total * 0.6); }

  function filtered(){
    const q = $("q").value.trim().toLowerCase(), cls = $("cls").value,
          view = $("view").value, test = $("test").value;
    let list = rows.filter(function(r){
      return (!cls || r.clazz === cls)
        && (!test || String(r.total) === test)
        && (!q || (r.name + " " + r.email).toLowerCase().indexOf(q) >= 0);
    });
    if (view !== "all"){
      const pick = {};
      list.forEach(function(r){
        const k = keyOf(r) + "|" + r.total, cur = pick[k];
        if (!cur) { pick[k] = r; return; }
        if (view === "best" ? r.score > cur.score : r.attempt > cur.attempt) pick[k] = r;
      });
      list = Object.keys(pick).map(function(k){ return pick[k]; });
    }
    const f = FIELDS[sortCol];
    list.sort(function(a,b){
      const x = a[f], y = b[f];
      let c;
      if (typeof x === "number" && typeof y === "number") c = x - y;
      else c = String(x).localeCompare(String(y), "vi");
      if (c !== 0) return c * sortDir;
      return (a.clazz + a.name).localeCompare(b.clazz + b.name, "vi");
    });
    return list;
  }

  function render(){
    const list = filtered();
    const pass = list.filter(function(r){ return r.score >= passOf(r); }).length;
    const avgPct = list.length ? (list.reduce(function(s,r){ return s + r.pct; }, 0) / list.length) : 0;
    const maxPct = list.length ? Math.max.apply(null, list.map(function(r){ return r.pct; })) : 0;
    const classes = {}; list.forEach(function(r){ if (r.clazz) classes[r.clazz] = 1; });

    $("stats").innerHTML =
        stat(list.length, "Dòng đang hiển thị")
      + stat(Object.keys(classes).length, "Số lớp")
      + stat(avgPct.toFixed(1) + "%", "Tỷ lệ đúng trung bình")
      + stat(pass + "/" + list.length, "Đạt (≥ 60%)")
      + stat(list.length ? Math.round(pass/list.length*100) + "%" : "0%", "Tỷ lệ đạt")
      + stat(maxPct + "%", "Kết quả cao nhất");

    $("thead").innerHTML = COLS.map(function(c,i){
      return "<th data-i='"+i+"'>" + c + (i === sortCol ? (sortDir > 0 ? " ▲" : " ▼") : "") + "</th>";
    }).join("");
    $("thead").querySelectorAll("th").forEach(function(th){
      th.addEventListener("click", function(){
        const i = +th.dataset.i;
        if (i === sortCol) sortDir = -sortDir; else { sortCol = i; sortDir = (i === 5 || i === 7) ? -1 : 1; }
        render();
      });
    });

    $("tbody").innerHTML = list.map(function(r){
      const ok = r.score >= passOf(r);
      return "<tr" + (ok ? "" : ' style="background:#fff5f5"') + ">"
        + td(r.time) + td(r.name) + "<td><b>" + esc(r.clazz) + "</b></td>" + td(r.email)
        + td("Lần " + r.attempt) + "<td><b>" + r.score + "</b></td>" + td(r.total) + td(r.pct + "%")
        + '<td><span class="pill ' + (ok ? "pass" : "fail") + '">' + (ok ? "Đạt" : "Chưa đạt") + "</span></td>"
        + td(r.mins + " phút") + "</tr>";
    }).join("");
    $("count").textContent = "Hiển thị " + list.length + " dòng / tổng " + rows.length + " lượt làm bài.";

    const g = {};
    list.forEach(function(r){
      const c = r.clazz || "(chưa ghi lớp)";
      if (!g[c]) g[c] = {n:0, sum:0, ok:0};
      g[c].n++; g[c].sum += r.pct; if (r.score >= passOf(r)) g[c].ok++;
    });
    $("byclass").innerHTML = Object.keys(g).sort(function(a,b){ return a.localeCompare(b,"vi"); })
      .map(function(c){
        const b = g[c];
        return "<tr><td><b>"+esc(c)+"</b></td><td>"+b.n+"</td><td>"+(b.sum/b.n).toFixed(1)+"%</td><td>"
          + b.ok+"/"+b.n+"</td><td>"+Math.round(b.ok/b.n*100)+"%</td></tr>";
      }).join("");
  }

  function stat(v, l){ return '<div class="stat"><b>'+esc(String(v))+'</b><span>'+esc(l)+'</span></div>'; }
  function td(v){ return "<td>" + esc(String(v)) + "</td>"; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }

  ["q","cls","view","test"].forEach(function(id){
    $(id).addEventListener("input", function(){ if (rows.length) render(); });
  });

  $("csvBtn").addEventListener("click", function(){
    if (!rows.length) { msg("warn", "Chưa có dữ liệu — hãy tải bảng điểm trước."); return; }
    const list = filtered();
    const aoa = [COLS].concat(list.map(function(r){
      return [r.time, r.name, r.clazz, r.email, r.attempt, r.score, r.total, r.pct, r.res, r.mins];
    }));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const csv = "\ufeff" + XLSX.utils.sheet_to_csv(ws);
    const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
    const a = document.createElement("a");
    a.href = url; a.download = "bang-diem-lop.csv"; a.click();
    URL.revokeObjectURL(url);
  });

  $("xlsxBtn").addEventListener("click", function(){
    window.open("https://github.com/" + CONFIG.owner + "/" + CONFIG.repo + "/raw/" + CONFIG.branch + "/" + CONFIG.path, "_blank");
  });
})();
</script>
</body>
</html>
